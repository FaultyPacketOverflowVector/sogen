name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g., v1.0.0)"
        required: true
        type: string

permissions:
  contents: write
  actions: write

jobs:
  # ── Build everything first ──────────────────────────────────────
  build:
    uses: ./.github/workflows/ci-reusable.yml
    secrets: inherit
    with:
      enable_deploy: true
      verbose: "false"

  # ── Gather and publish release ──────────────────────────────────
  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      # ── Download all build artifacts ──
      - name: Download Windows x86_64 artifacts
        uses: actions/download-artifact@v8
        with:
          name: Windows x86_64 Release Artifacts
          path: dist/windows-x86_64

      - name: Download Windows x86 artifacts
        uses: actions/download-artifact@v8
        with:
          name: Windows x86 Release Artifacts
          path: dist/windows-x86

      - name: Download Linux x86_64 Clang artifacts
        uses: actions/download-artifact@v8
        with:
          name: Linux x86_64 Clang Release Artifacts
          path: dist/linux-x86_64

      - name: Download Linux arm64 Clang artifacts
        uses: actions/download-artifact@v8
        with:
          name: Linux arm64 Clang Release Artifacts
          path: dist/linux-arm64

      - name: Download macOS arm64 artifacts
        uses: actions/download-artifact@v8
        with:
          name: macOS arm64 Release Artifacts
          path: dist/macos-arm64

      - name: Download Emscripten Web artifacts
        uses: actions/download-artifact@v8
        with:
          name: Emscripten Web Release Artifacts
          path: dist/emscripten-web

      - name: Download Emscripten Web Memory 64 artifacts
        uses: actions/download-artifact@v8
        with:
          name: Emscripten Web Memory 64 Release Artifacts
          path: dist/emscripten-web-memory64

      - name: Download Emscripten Node.js artifacts
        uses: actions/download-artifact@v8
        with:
          name: Emscripten Node.js Release Artifacts
          path: dist/emscripten-nodejs

      - name: Download MinGW x86_64 artifacts
        uses: actions/download-artifact@v8
        with:
          name: MinGW x86_64 Release Artifacts
          path: dist/mingw-x86_64

      - name: Download Emulation Root
        uses: actions/download-artifact@v8
        with:
          name: Windows 2025 Emulation Root
          path: dist/emulation-root

      - name: Download Page artifacts
        uses: actions/download-artifact@v8
        with:
          name: Page Artifacts
          path: dist/page

      - name: Download Python wheels
        uses: actions/download-artifact@v8
        with:
          pattern: sogen-wheel-*
          path: dist/wheels
          merge-multiple: true

      - name: Download Python sdist
        uses: actions/download-artifact@v8
        with:
          name: sogen-sdist
          path: dist/sdist

      # ── Package platform archives ──
      - name: Package Windows x86_64
        run: |
          cd dist/windows-x86_64
          zip -r "../../sogen-${{ steps.version.outputs.tag }}-windows-x86_64.zip" .

      - name: Package Windows x86
        run: |
          cd dist/windows-x86
          zip -r "../../sogen-${{ steps.version.outputs.tag }}-windows-x86.zip" .

      - name: Package Linux x86_64
        run: |
          cd dist/linux-x86_64
          tar -czf "../../sogen-${{ steps.version.outputs.tag }}-linux-x86_64.tar.gz" .

      - name: Package Linux arm64
        run: |
          cd dist/linux-arm64
          tar -czf "../../sogen-${{ steps.version.outputs.tag }}-linux-arm64.tar.gz" .

      - name: Package macOS arm64
        run: |
          cd dist/macos-arm64
          tar -czf "../../sogen-${{ steps.version.outputs.tag }}-macos-arm64.tar.gz" .

      - name: Package Emscripten Web
        run: |
          cd dist/emscripten-web
          zip -r "../../sogen-${{ steps.version.outputs.tag }}-emscripten-web.zip" .

      - name: Package Emscripten Web Memory 64
        run: |
          cd dist/emscripten-web-memory64
          zip -r "../../sogen-${{ steps.version.outputs.tag }}-emscripten-web-memory64.zip" .

      - name: Package Emscripten Node.js
        run: |
          cd dist/emscripten-nodejs
          zip -r "../../sogen-${{ steps.version.outputs.tag }}-emscripten-nodejs.zip" .

      - name: Package MinGW x86_64
        run: |
          cd dist/mingw-x86_64
          zip -r "../../sogen-${{ steps.version.outputs.tag }}-mingw-x86_64.zip" .

      - name: Package Emulation Root
        run: |
          cd dist/emulation-root
          zip -r "../../sogen-${{ steps.version.outputs.tag }}-emulation-root.zip" .

      - name: Package Web Playground
        run: |
          cd dist/page
          zip -r "../../sogen-${{ steps.version.outputs.tag }}-web-playground.zip" .

      # ── Create GitHub Release ──
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Sogen ${{ steps.version.outputs.tag }}
          draft: false
          prerelease: ${{ contains(steps.version.outputs.tag, '-rc') || contains(steps.version.outputs.tag, '-beta') || contains(steps.version.outputs.tag, '-alpha') }}
          files: |
            sogen-${{ steps.version.outputs.tag }}-windows-x86_64.zip
            sogen-${{ steps.version.outputs.tag }}-windows-x86.zip
            sogen-${{ steps.version.outputs.tag }}-linux-x86_64.tar.gz
            sogen-${{ steps.version.outputs.tag }}-linux-arm64.tar.gz
            sogen-${{ steps.version.outputs.tag }}-macos-arm64.tar.gz
            sogen-${{ steps.version.outputs.tag }}-emscripten-web.zip
            sogen-${{ steps.version.outputs.tag }}-emscripten-web-memory64.zip
            sogen-${{ steps.version.outputs.tag }}-emscripten-nodejs.zip
            sogen-${{ steps.version.outputs.tag }}-mingw-x86_64.zip
            sogen-${{ steps.version.outputs.tag }}-emulation-root.zip
            sogen-${{ steps.version.outputs.tag }}-web-playground.zip
            dist/wheels/*.whl
            dist/sdist/*.tar.gz
          generate_release_notes: true
