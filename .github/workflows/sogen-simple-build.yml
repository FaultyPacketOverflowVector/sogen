# Simple straight build - no tests, no tidy, no emulation root, no deploy.
#
# Copy this file to .github/workflows/ in your fork, e.g.
#   cp ~/Downloads/sogen-simple-build.yml .github/workflows/simple-build.yml
#
# Triggers: every push + manual "Run workflow" button.
#
# WHAT IT PRODUCES (6 artifacts in the run's Artifacts section):
#   1. sogen-windows-x64.zip    - everything in build/release/artifacts on Windows:
#        analyzer.exe, windows-emulator-test.exe, sandbox.exe, fuzzer.exe,
#        test-sample.exe, hook-sample.exe, bad-sample.exe, vulkan-shim-test.exe,
#        vulkan-shim.dll, linux-emulator-test.exe, ... (+ DLL dependencies)
#        NOTE: steam shims (steamclient*.dll) are NOT in here - they are
#        EXCLUDE_FROM_ALL and only build via `-t emulation-root-tools`.
#   2. sogen-linux-x64.tar.gz   - same set on Linux (no .exe/.dll suffixes:
#        analyzer, windows-emulator-test, sandbox, fuzzer, test-sample,
#        vulkan-shim.so, ...)
#   3. sogen-macos-arm64.tar.gz - same set on macOS (analyzer, ...,
#        vulkan-shim.dylib, ...)
#   4. sogen-wheel-windows-x64  - sogen-*-cp39-*-win_amd64.whl (pip installable)
#   5. sogen-wheel-linux-x64    - sogen-*-cp39-*-linux_x86_64.whl
#   6. sogen-wheel-macos-arm64  - sogen-*-cp39-*-macosx_*_arm64.whl
#
# WHAT IT SKIPS vs the stock CI (ci-reusable.yml):
#   clang-tidy, clang-format check, emulation-root creation (DirectX/DXVK),
#   all ctest runs, all smoke tests (WHP/KVM/FEX/MinGW/Android/Node),
#   web page build, PyPI publish, Pages deploy, fuzz workflow.

name: Simple Build

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.ref }}-simple
  cancel-in-progress: true

jobs:
  build-windows-x64:
    name: Build Windows x64
    runs-on: windows-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up Python (libclang host)
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install libclang (Steam bridge codegen)
        run: python -m pip install --disable-pip-version-check libclang

      - name: Enable Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1.13.0
        with:
          arch: x64

      - name: CMake Build
        run: cmake --preset=release -DSOGEN_ENABLE_AVX2=OFF && cmake --build --preset=release

      - name: Zip binaries
        shell: pwsh
        run: Compress-Archive -Path build/release/artifacts/* -DestinationPath sogen-windows-x64.zip -Force

      - name: Upload binaries
        uses: actions/upload-artifact@v7
        with:
          name: sogen-windows-x64
          path: sogen-windows-x64.zip
          retention-days: 14

      - name: Set up Python (wheel)
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Build wheel
        run: |
          python -m pip install --upgrade pip build setuptools-scm
          python -m build "${{ github.workspace }}" --wheel --outdir dist
        env:
          CMAKE_ARGS: "-DSOGEN_ENABLE_AVX2=OFF"

      - name: Upload wheel
        uses: actions/upload-artifact@v7
        with:
          name: sogen-wheel-windows-x64
          path: dist/*.whl
          retention-days: 14

  build-linux-x64:
    name: Build Linux x64
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up Python (libclang host)
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install libclang (Steam bridge codegen)
        run: python -m pip install --disable-pip-version-check libclang

      - name: Install Linux UI Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libpulse-dev libjack-jackd2-dev libsndio-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev \
            libxi-dev libxss-dev libxtst-dev libxkbcommon-dev \
            libdrm-dev libgbm-dev libgl1-mesa-dev libegl-dev libgles-dev \
            libdbus-1-dev libudev-dev \
            libpipewire-0.3-dev libwayland-dev libdecor-0-dev liburing-dev

      - name: CMake Build
        run: cmake --preset=release -DSOGEN_ENABLE_AVX2=OFF && cmake --build --preset=release

      - name: Tar binaries
        run: tar czf sogen-linux-x64.tar.gz -C build/release/artifacts .

      - name: Upload binaries
        uses: actions/upload-artifact@v7
        with:
          name: sogen-linux-x64
          path: sogen-linux-x64.tar.gz
          retention-days: 14

      - name: Set up Python (wheel)
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Build wheel
        run: |
          python -m pip install --upgrade pip build setuptools-scm
          python -m build "${{ github.workspace }}" --wheel --outdir dist
        env:
          CMAKE_ARGS: "-DSOGEN_ENABLE_AVX2=OFF"

      - name: Upload wheel
        uses: actions/upload-artifact@v7
        with:
          name: sogen-wheel-linux-x64
          path: dist/*.whl
          retention-days: 14

  build-macos-arm64:
    name: Build macOS arm64
    runs-on: macos-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up Python (libclang host)
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install libclang (Steam bridge codegen)
        run: python -m pip install --disable-pip-version-check libclang

      - name: CMake Build
        run: cmake --preset=release -DSOGEN_ENABLE_AVX2=OFF && cmake --build --preset=release

      - name: Tar binaries
        run: tar czf sogen-macos-arm64.tar.gz -C build/release/artifacts .

      - name: Upload binaries
        uses: actions/upload-artifact@v7
        with:
          name: sogen-macos-arm64
          path: sogen-macos-arm64.tar.gz
          retention-days: 14

      - name: Set up Python (wheel)
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Build wheel
        run: |
          python -m pip install --upgrade pip build setuptools-scm
          python -m build "${{ github.workspace }}" --wheel --outdir dist
        env:
          CMAKE_ARGS: "-DSOGEN_ENABLE_AVX2=OFF"

      - name: Upload wheel
        uses: actions/upload-artifact@v7
        with:
          name: sogen-wheel-macos-arm64
          path: dist/*.whl
          retention-days: 14
